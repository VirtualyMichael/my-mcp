[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alcohol-tracker-mcp"
version = "0.1.0"
description = "Safe MCP server for the Alcohol Tracker app: log preset doses by voice, undo your own, detailed reports"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
alcohol-tracker-mcp = "alcohol_tracker_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
